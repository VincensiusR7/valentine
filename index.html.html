<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Valentine Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899;
            --primary-dark: #be185d;
            --spine-shadow: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 10%);
            --paper-curve: linear-gradient(to right, #e5e5e5 0%, #fff 4%, #fff0f3 100%);
            --depth: 1800px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #831843 0%, #500724 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Music Control Button --- */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(190, 24, 93, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #ec4899;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
        }

        .music-control:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.7);
        }

        .music-control:active {
            transform: scale(0.95);
        }

        .music-icon {
            font-size: 1.5rem;
            color: white;
        }

        .music-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ec4899;
            animation: pulse 2s ease-out infinite;
            opacity: 0;
        }

        .music-control.playing .music-waves {
            opacity: 1;
        }

        /* Song info tooltip */
        .song-info {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: rgba(190, 24, 93, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #ec4899;
            border-radius: 15px;
            padding: 10px 15px;
            color: white;
            font-size: 0.85rem;
            font-family: 'Dancing Script', cursive;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            max-width: 200px;
            text-align: center;
            z-index: 999;
        }

        .song-info.show {
            opacity: 1;
            transform: translateY(0);
        }

        .song-number {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 3px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* --- Floating Background/Foreground --- */
        .floating-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden;
        }
        .bg-layer { z-index: 0; opacity: 0.15; }
        .fg-layer { z-index: 100; opacity: 0.4; }

        .float-item {
            position: absolute;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- 3D Book Scene --- */
        .scene {
            perspective: var(--depth);
            width: 90vw; height: 85vh;
            max-width: 550px; max-height: 750px;
            position: relative;
            z-index: 10;
        }

        .book {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: transform 0.5s;
        }

        /* --- Page Structure (Enhanced 3D) --- */
        .page {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.4s cubic-bezier(0.15, 1, 0.3, 1);
            cursor: pointer;
            border-radius: 0 15px 15px 0;
        }

        /* Thickness pseudo-element */
        .page::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 4px;
            background: rgba(0,0,0,0.1);
            transform: translateX(-2px) translateZ(-1px) rotateY(90deg);
        }

        .front, .back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 0 15px 15px 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: #fff0f3;
            border: 1px solid #fbcfe8;
        }

        .front {
            background: var(--paper-curve);
            box-shadow: inset 5px 0 10px rgba(0,0,0,0.05);
            z-index: 2;
        }

        .back {
            background: linear-gradient(to right, #fbcfe8, #f9a8d4);
            transform: rotateY(180deg);
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
            border-left: 5px solid rgba(0,0,0,0.05);
            z-index: 1;
        }

        /* --- Date Ribbon --- */
        .date-ribbon {
            position: absolute;
            top: 20px; right: -8px;
            background: #be185d;
            color: white;
            padding: 5px 25px 5px 15px;
            font-family: 'Dancing Script';
            font-size: 1.2rem;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.2);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 10% 50%);
        }
        .date-ribbon::after {
            content: '';
            position: absolute;
            top: 100%; right: 0;
            width: 8px; height: 8px;
            background: #831843;
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        /* --- Cover Page --- */
        .cover-front {
            background: #be185d;
            background-image: radial-gradient(#db2777 15%, transparent 16%), radial-gradient(#db2777 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            border: 8px solid #831843;
            box-shadow: inset 10px 0 30px rgba(0,0,0,0.3);
        }

        /* Ribbon Cutting Animation */
        .ribbon-band {
            position: absolute;
            background: #fbcfe8;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            z-index: 5;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .ribbon-v { width: 60px; height: 100%; top: 0; left: 50%; transform: translateX(-50%); }
        .ribbon-h { width: 100%; height: 60px; top: 40%; left: 0; }
        
        .ribbon-band.cut {
            opacity: 0;
            transform: scale(1.5);
            filter: blur(10px);
        }

        .cover-card {
            z-index: 10;
            background: rgba(255,255,255,0.95);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 2px solid #ec4899;
            width: 85%;
        }

        .input-group {
            margin: 20px 0;
            transition: opacity 0.3s;
        }

        .name-input {
            width: 100%; padding: 12px;
            border: 2px solid #fbcfe8; border-radius: 10px;
            text-align: center; font-size: 1.1rem; color: #be185d;
            font-family: 'Poppins';
        }

        .cut-btn {
            background: #be185d; color: white;
            padding: 12px 30px; border-radius: 30px;
            border: none; cursor: pointer;
            font-size: 1.2rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin: 0 auto;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(190, 24, 93, 0.4);
        }
        .cut-btn:hover { transform: scale(1.05); }

        /* --- Content Styling --- */
        .page-header {
            text-align: center;
            width: 100%;
        }
        
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #831843;
            margin: 0;
            background: linear-gradient(45deg, #be185d, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .personalized-name {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ec4899;
            margin-bottom: 1rem;
            min-height: 35px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        .page-body {
            background: rgba(255,255,255,0.6);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #f472b6;
            text-align: center;
            width: 90%;
            transform: rotate(-1deg);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.05);
        }

        .gift-icon {
            font-size: 6rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        /* Enhanced content styling */
        .day-description {
            font-size: 1.1rem;
            color: #831843;
            font-family: 'Poppins';
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .day-quote {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: #be185d;
            font-style: italic;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #f472b6;
        }

        /* --- Proposal & Logic --- */
        .btn-arena {
            width: 100%; height: 180px;
            position: relative; margin-top: 20px;
        }
        .btn {
            padding: 12px 35px; border-radius: 50px;
            font-weight: bold; cursor: pointer; border: none;
            font-size: 1.2rem; position: absolute;
            transition: all 0.3s;
        }
        .btn-yes {
            background: #ec4899; color: white;
            left: 50%; top: 50%; transform: translate(-120%, -50%);
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.5);
        }
        .btn-no {
            background: white; color: #9ca3af; border: 2px solid #e5e7eb;
            left: 50%; top: 50%; transform: translate(20%, -50%);
        }

        /* --- Calculator --- */
        .calc-box {
            background: white; padding: 20px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
        }

        /* Decor */
        .corner-decor {
            position: absolute; width: 50px; height: 50px;
            border: 4px double #fbcfe8; opacity: 0.6;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* Success overlay */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .success-overlay.show {
            display: flex;
            opacity: 1;
        }
        .success-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .success-overlay.show .success-card {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- Background Music - Multiple Songs -->
    <audio id="bgMusic">
        <source id="audioSource" src="" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Music Control Button -->
    <div class="music-control" id="musicControl" onclick="toggleMusic()">
        <div class="music-waves"></div>
        <div class="music-waves" style="animation-delay: 0.5s;"></div>
        <span class="music-icon" id="musicIcon">🎵</span>
    </div>

    <!-- Song Info Tooltip -->
    <div class="song-info" id="songInfo">
        <div id="songTitle">Loading...</div>
        <div class="song-number" id="songNumber">Song 1/3</div>
    </div>

    <!-- Floating Backgrounds -->
    <div class="floating-container bg-layer" id="bg-floats"></div>
    <div class="floating-container fg-layer" id="fg-floats"></div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-card">
            <div style="font-size: 4rem; margin-bottom: 1rem;">💕🎉</div>
            <h2 style="font-family: 'Dancing Script'; font-size: 2.5rem; color: #be185d; margin-bottom: 1rem;">
                You Said Yes!
            </h2>
            <p style="color: #831843; margin-bottom: 1.5rem;">
                You've made me the happiest person alive!<br>
                Happy Valentine's Day, my love!
            </p>
            <button class="cut-btn" onclick="goToCalculator()">
                💕 Calculate Our Love
            </button>
        </div>
    </div>

    <div class="scene">
        <div class="book" id="book">
            <!-- Pages injected via JS -->
        </div>
    </div>

    <script>
        // --- PLAYLIST CONFIGURATION ---
        // Ganti path file musik lo di sini (3 lagu)
        const playlist = [
            {
                src: "Mitski - My Love Mine All Mine.mp3",  // Ganti dengan file lagu pertama lo
                title: "Mitski - My Love Mine All Mine"
            },
            {
                src: "Laufey - Valentine (Official Audio).mp3",  // Ganti dengan file lagu kedua lo
                title: "Laufey - Valentine"
            },
            {
                src: "beabadoobee - Glue Song (Official Music Video).mp3",  // Ganti dengan file lagu ketiga lo
                title: "Beabadoobee - Glue Song"
            }
        ];

        // --- Music Control Variables ---
        const bgMusic = document.getElementById('bgMusic');
        const audioSource = document.getElementById('audioSource');
        const musicControl = document.getElementById('musicControl');
        const musicIcon = document.getElementById('musicIcon');
        const songInfo = document.getElementById('songInfo');
        const songTitle = document.getElementById('songTitle');
        const songNumber = document.getElementById('songNumber');
        
        let currentSongIndex = 0;
        let isPlaying = false;

        // --- Music Control Functions ---
        function loadSong(index) {
            if (index >= playlist.length) {
                index = 0; // Kalo udah abis semua lagu, balik ke lagu pertama
            }
            
            currentSongIndex = index;
            audioSource.src = playlist[index].src;
            bgMusic.load();
            
            // Update song info
            songTitle.textContent = playlist[index].title;
            songNumber.textContent = `Song ${index + 1}/${playlist.length}`;
            
            // Show song info briefly
            showSongInfo();
        }

        function showSongInfo() {
            songInfo.classList.add('show');
            setTimeout(() => {
                songInfo.classList.remove('show');
            }, 3000);
        }

        function playMusic() {
            bgMusic.play().then(() => {
                isPlaying = true;
                musicControl.classList.add('playing');
                musicIcon.textContent = '🎵';
            }).catch(error => {
                console.log('Music play failed:', error);
            });
        }

        function pauseMusic() {
            bgMusic.pause();
            isPlaying = false;
            musicControl.classList.remove('playing');
            musicIcon.textContent = '🔇';
        }

        function toggleMusic() {
            if (isPlaying) {
                pauseMusic();
            } else {
                playMusic();
            }
        }

        function nextSong() {
            loadSong(currentSongIndex + 1);
            if (isPlaying) {
                playMusic();
            }
        }

        // Event listener: Kalo lagu udah selesai, auto pindah ke lagu berikutnya
        bgMusic.addEventListener('ended', () => {
            nextSong();
        });

        // Event listener: Show song info on hover
        musicControl.addEventListener('mouseenter', () => {
            if (isPlaying) {
                showSongInfo();
            }
        });

        // Load first song on page load
        loadSong(0);

        // Try to autoplay (may be blocked by browser policies)
        window.addEventListener('load', () => {
            setTimeout(() => {
                playMusic();
            }, 500);
        });

        // Enable music on first user interaction (fallback for autoplay block)
        let hasInteracted = false;
        function enableMusicOnInteraction() {
            if (!hasInteracted && !isPlaying) {
                playMusic();
                hasInteracted = true;
            }
        }
        document.addEventListener('click', enableMusicOnInteraction, { once: true });
        document.addEventListener('touchstart', enableMusicOnInteraction, { once: true });

        // --- Enhanced Data with Detailed Content ---
        const daysData = [
            { 
                date: "Feb 7", 
                title: "When My Heart Chose You", 
                icon: "💍", 
                desc: "I've always been careful with my feelings, keeping my walls high and my secrets higher. But then you happened. My heart didn't just choose you, it recognized you like you were here before. My heart will always chooses you every morning when I wake up, every time things get hard, and every time we share a stupid joke.",
                quote: "Nalezl jsem toho, koho miluje má duše." 
            },
            { 
                date: "Feb 8", 
                title: "The Sweetness You Brought Into My Life", 
                icon: "🍫", 
                desc: "I never knew how bitter the world was until I tasted the sweetness you brought into it. Now, every day feels like a soft exhale I didn't know I was holding. You are the 'good' in every morning and the 'sweet' in every dream. Life is just better since the day you happened to me.",
                quote: "Hospodin mu ukázal dřevo, i hodil je do vody, a vody se staly sladkými." 
            },
            { 
                date: "Feb 9", 
                title: "My Safe Place", 
                icon: "🧸", 
                desc: "I spent so many days bracing myself against the world, keeping my shoulders tight and my guard up. I thought being safe meant being alone. But then you happened, and for the first time, I felt my guard down. You are the sweetness that reminds me I am okay. You are my rest. You are my safe place.",
                quote: "V tobě má duše nachází klid." 
            },
            { 
                date: "Feb 10", 
                title: "Where I Belong", 
                icon: "🤗", 
                desc: "The world is terrifyingly vast, isn't it? Millions of streets I have never walked, thousands of cities I will never see, and so many people who are just... passing by. For a long time, I was so tired of trying to fit in or build a home out of things that didn't last. But then I found you. I'm done looking. I don't need to find a place on a map anymore. I just need to be wherever you are. Because in a world where I felt like I belonged nowhere, you became the only place where I finally, truly, belong.",
                quote: "Kamkoli půjdeš, půjdu, kdekoli zůstaneš, zůstanu. Tvůj lid bude mým lidem." 
            },
            { 
                date: "Feb 11", 
                title: "A Promise I Will Always Keep", 
                icon: "🤙", 
                desc: "I used to think a promise was a one time thing, said at an altar or written in a letter. But now I know that my promise to you is something I renew every morning when I wake up. It iss the easiest vow I have ever made: to choose you, to recognize you, and to bring sweetness to your days, just as you have brought it to mine.",
                quote: "Můj slib je věčný, jako hvězdy na nebi." 
            },
            { 
                date: "Feb 12", 
                title: "The Night My Love Spoke", 
                icon: "💋", 
                desc: "When the night finally comes that we are no longer a distance, I won't need words to tell you how much I love You. I want to spend those hours finally learning the map of your skin, tracing every curve with my fingertips until I know you by heart. I want to lose myself in the taste of you. We're going to share everything until the sun tries to take the moonlight away.",
                quote: "Kéž políbí mě polibkem svých úst! Vždyť tvé laskání je lepší než víno." 
            },
            { 
                date: "Feb 13", 
                title: "Something Just for You ⭐", 
                icon: "🌹", 
                desc: "I once told you that you are my home and my 'safe place.' Well, before it speaks in words or kisses, I want it to speak in a gesture that is meant only for your heart. Now, my sweet ellie, Behind you, someone who loves you just as much as I do is waiting. She's holding a small box, I want you to take that box, open it, and see what's inside. It's a reminder that even when the world is vast and terrifying, I am always, always right there with you. Now... turn around, and take what is yours.",
                quote: "Je to malý kousek mě pro tebe. Otevři ho." 
            },
            { 
                date: "Feb 14", 
                title: "Valentine's Day", 
                icon: "❤️", 
                desc: "Everyone's know tomorrow is Valentine's Day. Since the world is celebrating tomorrow, I want to steal you away. I want you all to myself—no distractions, no distance, just us. I want to spend every hour of the day reminding you that you are my home, my rest, and my favorite place to be. Valentine's may come once a year, but loving you is my daily liturgy. I choose you when the sun rises, I choose you when the world gets loud, and I'll choose you every day that follows. ",
                quote: "Hospodinovo milosrdenství nepomíjí, jeho slitování nekončí. Obnovuje se každé ráno." 
            }
        ];

        // Check URL for Name
        const urlParams = new URLSearchParams(window.location.search);
        let urlName = urlParams.get('name');
        let userName = urlName ? decodeURIComponent(urlName) : "";
        let currentPage = 0;
        let calculatorPageIndex = 0; // Will be set in buildBook

        // --- Initialization ---
        const book = document.getElementById('book');
        initFloatingElements();
        buildBook();

        // --- 1. Build The Book ---
        function buildBook() {
            const totalPages = 1 + daysData.length + 2; // Cover + Days + Proposal + Calc
            calculatorPageIndex = totalPages - 1; // Last page is calculator
            let zIndex = totalPages;

            // A. COVER PAGE
            const coverPage = document.createElement('div');
            coverPage.className = 'page';
            coverPage.style.zIndex = zIndex--;
            
            // Logic for cover content based on URL
            let coverContentHTML = '';
            if (userName) {
                coverContentHTML = `
                    <h1 style="color:#be185d; font-family:'Dancing Script'; font-size:3rem; margin:0;">For You, ${userName}</h1>
                    <div style="font-size:5rem; margin:10px 0;">🎁</div>
                    <p style="color:#831843; font-style:italic;">A special gift awaits inside...</p>
                    <button class="cut-btn" onclick="cutRibbon(true)" style="margin-top:20px;">
                        <span>✂️</span> Cut Ribbon Slowly
                    </button>
                `;
            } else {
                coverContentHTML = `
                    <h1 style="color:#be185d; font-family:'Dancing Script'; font-size:2.5rem; margin:0;">For Someone Special</h1>
                    <h2 style="color:#be185d; font-family:'Dancing Script'; font-size:2.1rem; margin:0;">Ellie Wellie My Wifey ❤️❤️❤️</h2>
                    <div style="font-size:4rem; margin:10px 0;">🎁</div>
                    <div class="input-group" id="input-area">
                        <p style="color:#831843;">Please enter your name bellow 🤗</p>
                        <input type="text" id="input-name" class="name-input" placeholder="Enter Your Name Here Darling" autocomplete="off">
                    </div>
                    <button class="cut-btn" onclick="cutRibbon(false)">
                        <span>✂️</span> Cut Ribbon Slowly
                    </button>
                `;
            }

            coverPage.innerHTML = `
                <div class="front cover-front">
                    <div class="ribbon-band ribbon-v" id="ribbon-v"></div>
                    <div class="ribbon-band ribbon-h" id="ribbon-h"></div>
                    <div class="cover-card">
                        ${coverContentHTML}
                    </div>
                </div>
                <div class="back">
                    <div style="font-size:8rem; opacity:0.1;">❤️</div>
                </div>
            `;
            book.appendChild(coverPage);

            // B. DAYS PAGES
            daysData.forEach((day, index) => {
                const page = document.createElement('div');
                page.className = 'page';
                page.style.zIndex = zIndex--;
                
                page.innerHTML = `
                    <div class="front">
                        <div class="date-ribbon">${day.date}</div>
                        <div class="corner-decor tl"></div><div class="corner-decor tr"></div>
                        <div class="corner-decor bl"></div><div class="corner-decor br"></div>
                        
                        <div class="page-header">
                            <div class="gift-icon">${day.icon}</div>
                            <h2 class="page-title">${day.title}</h2>
                            <div class="personalized-name user-name-slot">
                                ${userName ? "Dearest " + userName : ""}
                            </div>
                        </div>
                        
                        <div class="page-body">
                            <p class="day-description">${day.desc}</p>
                            <div class="day-quote">"${day.quote}"</div>
                        </div>
                        
                        <div style="margin-top:auto; font-size:0.8rem; color:#be185d; font-weight:bold; opacity:0.7;">
                            Tap to Continue ➔
                        </div>
                    </div>
                    <div class="back">
                        <div style="font-size:6rem; opacity:0.1; transform: scaleX(-1);">${day.icon}</div>
                        <div style="margin-top: 20px; font-family: 'Dancing Script'; color: #be185d; font-size: 1.5rem; opacity: 0.6;">
                            ${day.title} Memories
                        </div>
                    </div>
                `;
                page.addEventListener('click', () => flipPage(index + 1));
                book.appendChild(page);
            });

            // C. PROPOSAL PAGE
            const proposalIndex = daysData.length + 1;
            const proposalPage = document.createElement('div');
            proposalPage.className = 'page';
            proposalPage.style.zIndex = zIndex--;
            
            proposalPage.innerHTML = `
                <div class="front">
                    <div class="corner-decor tl"></div><div class="corner-decor tr"></div>
                    <div class="corner-decor bl"></div><div class="corner-decor br"></div>
                    
                    <div class="personalized-name user-name-slot" style="font-size:2rem; margin-top:20px;">
                        ${userName ? userName : "My Love"}
                    </div>
                    
                    <h1 style="font-family:'Dancing Script'; font-size:3.5rem; color:#be185d; line-height:1; text-align:center; text-shadow:2px 2px 0 rgba(255,255,255,0.5);">
                        Will You Be<br>My Valentine?
                    </h1>
                    
                    <p style="color: #831843; text-align: center; margin: 20px 0; font-style: italic; max-width: 80%;">
                        Every page of this book tells a story of my love for you. 
                        Will you make me the happiest person and be my Valentine?
                    </p>
                    
                    <div class="btn-arena" id="arena">
                        <button class="btn btn-yes" onclick="sayYes(${proposalIndex})">YES ❤️</button>
                        <button class="btn btn-no" id="no-btn">NO</button>
                    </div>
                </div>
                <div class="back"></div>
            `;
            book.appendChild(proposalPage);

            // D. CALCULATOR PAGE
            const calcPage = document.createElement('div');
            calcPage.className = 'page';
            calcPage.style.zIndex = zIndex--;
            
            calcPage.innerHTML = `
                <div class="front">
                     <div class="corner-decor tl"></div><div class="corner-decor tr"></div>
                     <div class="corner-decor bl"></div><div class="corner-decor br"></div>
                     
                     <h2 class="page-title" style="font-size:2.2rem;">Love Calculator</h2>
                     
                     <div class="calc-box">
                        <div style="margin-bottom:15px;">
                            <label style="color:#be185d; font-size:0.8rem;">Your Name</label>
                            <input type="text" class="name-input" id="calc-name1" value="${userName}" readonly style="background:#fce7f3; cursor:default;">
                        </div>
                        <div style="color:#ec4899; font-size:1.5rem; margin:-10px 0 10px;">➕</div>
                        <div style="margin-bottom:15px;">
                            <label style="color:#be185d; font-size:0.8rem;">My Name</label>
                            <input type="text" class="name-input" id="calc-name2" placeholder="Partner's Name">
                        </div>
                        
                        <button class="cut-btn" onclick="calculateLove()" style="width:100%; font-size:1rem;">
                            Calculate Compatibility
                        </button>
                        
                        <div id="result-area" style="min-height:80px; margin-top:15px;">
                            <div id="love-score" style="font-size:3.5rem; color:#be185d; font-family:'Dancing Script'; line-height:1;"></div>
                            <div id="love-msg" style="font-size:0.9rem; color:#831843;"></div>
                        </div>
                     </div>
                     
                     <button onclick="copyLink()" style="margin-top:20px; background:transparent; border:1px solid #ec4899; color:#be185d; padding:8px 20px; border-radius:20px; cursor:pointer; font-size:0.9rem;">
                        🔗 Copy Link to Send
                     </button>
                </div>
                <div class="back"></div>
            `;
            book.appendChild(calcPage);
        }

        // --- 2. Logic Functions ---

        function cutRibbon(hasNameFromURL) {
            if (!hasNameFromURL) {
                const input = document.getElementById('input-name');
                const val = input.value.trim();
                if (!val) {
                    input.style.borderColor = "red";
                    setTimeout(() => input.style.borderColor = "#fbcfe8", 1000);
                    return;
                }
                userName = val;
                // Update URL without reloading to make it shareable
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('name', userName);
                window.history.pushState({}, '', newUrl);
            }

            // Update all name slots in the book
            document.querySelectorAll('.user-name-slot').forEach(el => {
                el.innerText = "Dearest " + userName;
            });
            document.getElementById('calc-name1').value = userName;

            // Visuals
            document.getElementById('ribbon-v').classList.add('cut');
            document.getElementById('ribbon-h').classList.add('cut');
            createConfetti();

            setTimeout(() => {
                flipPage(0);
            }, 800);
        }

        function flipPage(idx) {
            const pages = document.querySelectorAll('.page');
            if (idx >= pages.length) return;
            
            const page = pages[idx];
            page.style.transform = "rotateY(-180deg)";
            
            // Adjust Z-Index stack
            setTimeout(() => {
                page.style.zIndex = idx; 
                currentPage = idx + 1;
            }, 500);
        }

        function sayYes(idx) {
            createConfetti();
            createConfetti();
            createConfetti();
            
            setTimeout(() => {
                document.getElementById('successOverlay').classList.add('show');
            }, 500);
        }

        function goToCalculator() {
            // Hide the success overlay
            document.getElementById('successOverlay').classList.remove('show');
            
            // Flip to calculator page (which is the last page)
            setTimeout(() => {
                flipPage(calculatorPageIndex - 1); // -1 because we need to flip from proposal page
            }, 300);
        }

        // Runaway Button Logic
        setTimeout(() => {
            const noBtn = document.getElementById('no-btn');
            const arena = document.getElementById('arena');
            if (noBtn && arena) {
                const moveBtn = (e) => {
                    e.stopPropagation();
                    const arenaRect = arena.getBoundingClientRect();
                    const btnRect = noBtn.getBoundingClientRect();
                    
                    const maxX = arenaRect.width - btnRect.width - 20;
                    const maxY = arenaRect.height - btnRect.height - 20;
                    
                    const rX = Math.random() * maxX;
                    const rY = Math.random() * maxY;
                    
                    noBtn.style.left = rX + 'px';
                    noBtn.style.top = rY + 'px';
                    noBtn.style.transform = 'none';
                };
                
                noBtn.addEventListener('mouseover', moveBtn);
                noBtn.addEventListener('touchstart', moveBtn);
                noBtn.addEventListener('click', moveBtn);
            }
        }, 100);

        function calculateLove() {
            const n2 = document.getElementById('calc-name2').value.trim();
            if(!n2) { alert("Please enter the partner's name!"); return; }
            
            // Calculate love score based on names
            let score = 0;
            const combined = (userName + n2).toLowerCase();
            for (let char of combined) {
                score += char.charCodeAt(0);
            }
            score = (score % 40) + 60; // Score between 60-99
            
            // Special cases
            if (userName.toLowerCase() === n2.toLowerCase()) score = 100;
            if (combined.includes('love')) score = 100;

            const display = document.getElementById('love-score');
            const msg = document.getElementById('love-msg');
            
            let curr = 0;
            const timer = setInterval(() => {
                display.innerText = curr + "%";
                if(curr >= score) {
                    clearInterval(timer);
                    if (score >= 90) {
                        msg.innerText = "Perfect Match! Soulmates Forever! 💕";
                        createConfetti();
                    } else if (score >= 80) {
                        msg.innerText = "Great chemistry! Love is in the air! 💖";
                    } else {
                        msg.innerText = "Good potential! Keep nurturing your love! 💝";
                    }
                }
                curr++;
            }, 20);
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert("Link copied! Send it to your special someone! 💕");
            });
        }

        // --- Visual Effects ---
        function initFloatingElements() {
            const icons = ['❤️', '💖', '🎁', '🌹', '✨'];
            const containers = [document.getElementById('bg-floats'), document.getElementById('fg-floats')];
            
            containers.forEach(container => {
                for(let i=0; i<20; i++) {
                    const el = document.createElement('div');
                    el.className = 'float-item';
                    el.innerText = icons[Math.floor(Math.random() * icons.length)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    el.style.animationDuration = (Math.random() * 15 + 10) + 's';
                    el.style.animationDelay = (Math.random() * 10) + 's';
                    container.appendChild(el);
                }
            });
        }

        function createConfetti() {
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.width = '10px'; conf.style.height = '10px';
                conf.style.background = ['#ec4899','#fbbf24','#fff'].at(Math.floor(Math.random()*3));
                conf.style.left = '50%'; conf.style.top = '50%';
                conf.style.borderRadius = '50%';
                conf.style.pointerEvents = 'none';
                conf.style.zIndex = '9999';
                document.body.appendChild(conf);
                
                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * 300 + 100;
                
                conf.animate([
                    { transform: 'translate(0,0)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*vel}px, ${Math.sin(angle)*vel}px)`, opacity: 0 }
                ], { duration: 1000, easing: 'ease-out' }).onfinish = () => conf.remove();
            }
        }
        
        // Handle Enter key on Cover
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && currentPage === 0 && !urlName) {
                cutRibbon(false);
            }
        });

        // Prevent flipping when interacting with inputs
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') {
                e.stopPropagation();
            }
        });

    </script>
</body>
</html>
